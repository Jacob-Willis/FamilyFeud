    <link rel="stylesheet" href="css/master.css" />

    <link rel="icon" href="data:,">
    <style>
        /* #65: iOS/Mac WebKit ignores background-attachment: fixed, so the image
           sits on a fixed full-viewport layer instead. html is dark so nothing shows
           white; body stays transparent (overriding Bootstrap's white) so the layer
           shows through, and body must not get position + z-index (stacking context). */
        html {
            min-height: 100%;
            background-color: #0b0d1a;
        }

        body {
            min-height: 100%;
            background-color: transparent;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: url('Images/background2.png') center / cover no-repeat;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
